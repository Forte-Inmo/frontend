services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_PDF_SERVICE_URL: /pdf-api
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - app-network

  pdf-service:
    build:
      context: ./pdf-service
    restart: unless-stopped
    environment:
      - SUPABASE_URL=${VITE_SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-noreply@forteinmo.com}
      - APP_URL=${APP_URL}
      - RENDER_URL_HOST=${RENDER_URL_HOST:-host.docker.internal}
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge